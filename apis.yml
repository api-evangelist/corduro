aid: corduro
name: Corduro
description: >-
  Corduro is a payments-as-a-service company founded in 2008 and headquartered in Southlake, Texas,
  offering a mobile, online, and point-of-sale payment platform for small businesses, enterprises,
  and organizations. Its platform enables merchants to accept credit-card and electronic-check
  payments, bill pay, recurring billing, text giving, and event and donation payments through a single
  intelligent payment gateway that is advertised to reduce processing fees by 20% or more. Corduro
  bundles eCommerce, Engage, Events, Text Giving, and Developer Tools products, provides embeddable
  iFrame and API-based payment integrations, and markets PCI compliance as a managed capability. This
  API Evangelist profile was surfaced as a portfolio company of GV and enriched from the company's
  public web presence; Corduro publishes no public OpenAPI, developer portal, or API reference, gating
  developer/API access behind sales contact.
